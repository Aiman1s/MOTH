<script>
  /* ==== EDIT THESE TWO WHEN THE LINKS ARE READY ==== */
  var APP_STORE  = "https://apps.apple.com/gb/app/rabble-group-party-games/id6784893866";
  var PLAY_STORE = "https://play.google.com/store/apps/details?id=com.aeasolutions.crowdy";
  /* ================================================= */
  (function(){
    var ua = navigator.userAgent || navigator.vendor || "";
    var isAndroid = /android/i.test(ua) && !/windows phone/i.test(ua);
    var isIOS = /iphone|ipad|ipod/i.test(ua) ||
                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    try {
      if (isIOS && APP_STORE) { location.replace(APP_STORE); }
      else if (isAndroid && PLAY_STORE) { location.replace(PLAY_STORE); }
    } catch (e) {}
  })();
</script>
<style>
  :root{
    --bg:#000;--text:#eef2ee;--muted:#98a098;--muted-2:#7a867d;
    --accent:#2ea863;--accent-2:#46c47d;--lime:#A7E635;
    --display:"Space Grotesk",system-ui,sans-serif;--body:"Inter",system-ui,sans-serif;--mono:"Space Mono",ui-monospace,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{min-height:100dvh;background:var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 24px 64px;position:relative;overflow-x:hidden;}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(55% 45% at 30% 40%,rgba(46,168,99,.15),transparent 70%),radial-gradient(45% 40% at 85% 90%,rgba(6,64,43,.4),transparent 70%);}
  .home{position:fixed;top:22px;left:24px;z-index:3;display:inline-flex;align-items:center;gap:9px;text-decoration:none;color:var(--text);
    font-family:var(--display);font-weight:600;letter-spacing:.02em;font-size:15px;}
  .home svg{width:26px;height:26px;}

  .wrap{position:relative;z-index:1;width:100%;max-width:920px;display:flex;align-items:center;justify-content:center;gap:64px;}

  /* phone */
  .stage{flex:none;perspective:1300px;display:grid;place-items:center;padding:20px;}
  .glow{position:absolute;width:min(360px,70vw);aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle,rgba(46,168,99,.4),rgba(46,168,99,.08) 45%,transparent 70%);filter:blur(26px);z-index:0;}
  .phone{position:relative;z-index:1;width:262px;aspect-ratio:1320/2868;border-radius:44px;padding:4px;transform-style:preserve-3d;
    background:linear-gradient(150deg,#5c5c60,#1a1a1d 18%,#0c0c0e 50%,#1a1a1d 82%,#5c5c60);
    box-shadow:0 50px 110px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.05);animation:floaty 7s ease-in-out infinite;}
  .phone .screen{width:100%;height:100%;border-radius:40px;overflow:hidden;background:#000;position:relative;}
  .phone video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  @keyframes floaty{0%,100%{transform:translateY(0) rotateY(-10deg) rotateX(4deg);}50%{transform:translateY(-14px) rotateY(-6deg) rotateX(3deg);}}

  /* copy + actions */
  .panel{flex:1;min-width:0;max-width:360px;}
  .logo{height:36px;width:auto;}
  .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:18px;}
  h1{font-family:var(--display);font-weight:600;font-size:clamp(30px,5vw,44px);letter-spacing:-.03em;line-height:1.02;margin-top:10px;}
  .lede{color:var(--muted);font-size:16px;line-height:1.6;margin-top:12px;max-width:36ch;}
  .stores{display:flex;flex-direction:column;gap:12px;margin-top:26px;max-width:330px;}
  .store{display:flex;align-items:center;gap:13px;text-decoration:none;color:var(--text);
    border:1px solid rgba(120,170,135,.22);border-radius:14px;padding:14px 20px;font-family:var(--display);font-weight:600;font-size:16px;
    background:rgba(6,14,10,.5);transition:border-color .2s ease,background .2s ease,transform .12s ease;}
  .store:hover{border-color:var(--accent);background:rgba(46,168,99,.1);}
  .store:active{transform:translateY(1px);}
  .store .ico{width:24px;height:24px;display:grid;place-items:center;flex:none;}
  .store .ico svg{width:22px;height:22px;}
  .store small{display:block;font-family:var(--mono);font-weight:400;font-size:9px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;line-height:1.3;}
  .store .lbl{text-align:left;line-height:1.1;}
  .store.soon{pointer-events:none;border-style:dashed;border-color:rgba(120,170,135,.18);background:rgba(255,255,255,.015);color:var(--muted);}
  .store.soon .ico svg{opacity:.5;}
  .qr{display:flex;align-items:center;gap:14px;margin-top:24px;}
  .qr-tile{flex:none;background:#fff;border-radius:14px;padding:11px;width:104px;height:104px;box-shadow:0 20px 50px -24px rgba(0,0,0,.8);}
  .qr-tile svg{width:100%;height:100%;display:block;shape-rendering:crispEdges;}
  .qr-cap{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--muted-2);line-height:1.5;max-width:16ch;}
  .back{position:relative;z-index:1;margin-top:40px;font-family:var(--mono);font-size:12px;color:var(--muted-2);text-decoration:none;letter-spacing:.04em;}
  .back:hover{color:var(--accent-2);}

  @media(max-width:760px){
    .wrap{flex-direction:column;gap:36px;text-align:center;}
    .panel{display:flex;flex-direction:column;align-items:center;}
    .phone{width:210px;}
    .stores{width:100%;}
    .store{justify-content:center;}
    .qr{display:none;}
  }
  @media (prefers-reduced-motion: reduce){
    .phone{animation:none;transform:rotateY(-8deg) rotateX(3deg);}
    *{transition:none!important;}
  }
</style>
</head>
